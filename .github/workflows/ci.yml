name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bjj
          POSTGRES_PASSWORD: bjj
          POSTGRES_DB: bjj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bjj -d bjj_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: pytest (SQLite)
        run: uv run pytest
      - name: pytest (Postgres)
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bjj:bjj@localhost:5432/bjj_test

  frontend:
    name: Frontend (ESLint, Prettier, tsc, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match openapi.json
        run: npm run gen:api:types && git diff --exit-code -- src/api/schema.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
